<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>掲示板投稿</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #111214;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
        }

        h2 {
            margin: 0 0 16px;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            resize: vertical;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #1e1f22;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        .upload {
            margin-top: 15px;
            padding: 20px;
            border: 1px dashed #555;
            border-radius: 10px;
            background: #1e1f22;
            text-align: center;
        }

        input[type="file"] {
            width: 100%;
            margin-top: 12px;
        }

        #preview {
            margin-top: 15px;
        }

        #preview img,
        #preview video {
            max-width: 100%;
            max-height: 350px;
            border-radius: 8px;
        }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #5865f2;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        #status {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2 id="mode">匿名投稿</h2>

    <textarea
        id="content"
        maxlength="2000"
        placeholder="メッセージを入力してください..."
    ></textarea>

    <div class="upload">

        <div>📷 画像・動画を選択</div>

        <input
            id="file"
            type="file"
            accept="image/*,video/*"
        >

        <div id="preview"></div>

    </div>

    <button id="submit">
        投稿する
    </button>

    <div id="status"></div>

</div>

<script src="/static/post.js"></script>

</body>
</html>

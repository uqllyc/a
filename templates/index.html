<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>投稿</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #000000; color: #ffffff; margin: 0; padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; background: #000000; padding: 0px; }
    .warning { background: #2a2100; color: #ffcc00; padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 20px; line-height: 1.4; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 13px; color: #888888; margin-bottom: 8px; }
    input[type="text"], textarea { width: 100%; background: #111111; border: 1px solid #222222; color: #ffffff; padding: 14px; border-radius: 12px; font-size: 15px; outline: none; }
    textarea { height: 120px; resize: none; }
    input[type="text"]:focus, textarea:focus { border-color: #5865F2; }
    .radio-group { background: #111111; padding: 6px 14px; border-radius: 12px; border: 1px solid #222222; }
    .radio-label { display: flex; justify-content: space-between; align-items: center; color: #ffffff; font-size: 15px; padding: 10px 0; cursor: pointer; border-bottom: 1px solid #222222; }
    .radio-label:last-child { border-bottom: none; }
    .file-upload { background: #111111; border: 1px solid #222222; padding: 16px; border-radius: 12px; text-align: left; cursor: pointer; position: relative; display: flex; align-items: center; justify-content: space-between; }
    .file-upload input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    .btn-submit { width: 100%; background: #5865F2; color: #ffffff; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .btn-submit:disabled { background: #333333; color: #777777; }
    #status { margin-top: 14px; text-align: center; font-size: 14px; }
  </style>
</head>
<body>

<div class="container">
  <div class="warning">
    ⚠️ このフォームの内容は..に送られます。パスワードやその他の個人情報を送らないでください。
  </div>

  <form id="postForm" enctype="multipart/form-data">
    <div class="form-group">
      <label>投稿</label>
      <textarea name="content" placeholder="本文（任意・画像・動画のみの投稿も可）"></textarea>
    </div>

    <div class="form-group">
      <label>レス</label>
      <input type="text" name="ref_id" placeholder="例: 99 / n99">
      <div style="font-size:12px; color:#666; margin-top:4px;">引用する投稿番号（任意）</div>
    </div>

    <div class="form-group">
      <label>投稿方法 *</label>
      <div class="radio-group">
        <label class="radio-label">
          <span>匿名</span>
          <input type="radio" name="anonymous" value="true" checked>
        </label>
        <label class="radio-label">
          <span>非匿名</span>
          <input type="radio" name="anonymous" value="false">
        </label>
      </div>
    </div>

    <div class="form-group">
      <label>画像・動画</label>
      <div class="file-upload">
        <span id="fileName">ファイルをアップロード<br><small style="color:#666;">1個のファイル（20MB未満）をアップロードできます。</small></span>
        <input type="file" name="file" id="fileInput" accept="image/*,video/*">
      </div>
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">送信</button>
  </form>

  <div id="status"></div>
</div>

<script>
  const fileInput = document.getElementById('fileInput');
  const fileName = document.getElementById('fileName');
  const form = document.getElementById('postForm');
  const submitBtn = document.getElementById('submitBtn');
  const status = document.getElementById('status');

  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length > 0) {
      fileName.innerHTML = '📎 ' + e.target.files[0].name;
    } else {
      fileName.innerHTML = 'ファイルをアップロード<br><small style="color:#666;">1個のファイル（20MB未満）をアップロードできます。</small>';
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    status.textContent = '送信中...';

    const formData = new FormData(form);

    try {
      const response = await fetch('/submit', {
        method: 'POST',
        body: formData
      });
      const result = await response.json();

      if (response.ok) {
        status.style.color = '#57F287';
        status.textContent = result.message;
        form.reset();
        fileName.innerHTML = 'ファイルをアップロード<br><small style="color:#666;">1個のファイル（20MB未満）をアップロードできます。</small>';
      } else {
        status.style.color = '#ED4245';
        status.textContent = result.message || 'エラーが発生しました。';
      }
    } catch (err) {
      status.style.color = '#ED4245';
      status.textContent = '送信に失敗しました。';
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
